<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Название страницы</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700&family=JetBrains+Mono&display=swap" rel="stylesheet">
<style>
/* Цвета и шрифт. Внутренний инструмент — оставьте как есть (дизайн-система JTBD).
   Страница клиента — замените значения на цвета и шрифт с сайта клиента. */
:root{
  --bg:#FFFFFF; --surface:#F5F5F5; --line:#CED2DA; --text:#242525; --muted:#7F8185;
  --accent:#F2F84C; --accent-text:#242525;      /* акцент — один раз на экран */
  --warn:#FFF6D6; --error:#FDE7E4;
  --font:"Montserrat",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:500 15px/1.5 var(--font);padding:24px 16px 48px}
.wrap{max-width:1100px;margin:0 auto;display:grid;gap:20px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
h1{font:700 clamp(22px,4vw,32px)/1.2 var(--font);margin:0}
.asof{margin:4px 0 0;color:var(--muted);font-size:13px}
.btn{font:700 14px/1 var(--font);background:var(--accent);color:var(--accent-text);border:0;border-radius:8px;padding:12px 18px;cursor:pointer}
.btn:disabled{opacity:.55;cursor:default}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--text);outline-offset:2px}
.notice{border-radius:8px;padding:10px 14px;font-size:14px;background:var(--warn)}
.notice.error{background:var(--error)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.tile{background:var(--surface);border-radius:10px;padding:14px 16px}
.tile b{display:block;font:400 28px/1.1 var(--mono)}
.tile span{color:var(--muted);font-size:13px}
.filters{display:flex;gap:10px;flex-wrap:wrap}
input,select,textarea{font:500 14px/1.4 var(--font);color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 11px}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:700;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;background:var(--surface);position:sticky;top:0}
td.num{font-family:var(--mono);text-align:right;white-space:nowrap}
.empty{color:var(--muted);padding:24px;text-align:center}
@media (max-width:560px){body{padding:16px 12px 40px}.top .btn{width:100%}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1 id="title">Название страницы</h1>
      <p class="asof" id="asof">Загружаю данные…</p>
    </div>
    <button class="btn" id="refresh" type="button">Обновить</button>
  </header>
  <div class="notice" id="notice" hidden></div>
  <main id="app"></main>
</div>

<script>
"use strict";
/* Куда ходить за данными:
   — страница внутри Apps Script: google.script.run, ничего настраивать не нужно;
   — страница на Firebase / GitHub: по ссылке /exec, её вписывает tools/build.py;
   — пусто и не Apps Script: прототип на DEMO. */
const API_URL = "";

/* Демо-данные для прототипа. Форма — ровно как отдаёт payload_() в Code.js:
   когда подключим сервер, поменяется только источник, а не страница. */
const DEMO = {
  title: "Название страницы",
  tz: "Europe/Moscow",
  asOf: "2026-10-30T09:00:00Z",
  lastError: null,
  rows: [
    { "Сотрудник": "Иванова Анна", "Отдел": "Продажи", "Часы": 38.5, "Дата": "2026-10-28" },
    { "Сотрудник": "Петров Олег", "Отдел": "Продажи", "Часы": 41, "Дата": "2026-10-28" },
    { "Сотрудник": "Смирнова Ирина", "Отдел": "Сервис", "Часы": 29.25, "Дата": "2026-10-29" }
  ],
  tasks: []
};

const inGas = typeof google !== "undefined" && google.script && google.script.run;
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
let DATA = null;

/** Запрос к серверу: {action, ...} → объект ответа */
function call(action, body) {
  const req = Object.assign({ action: action }, body || {});
  if (inGas) return new Promise((ok, fail) =>
    google.script.run.withSuccessHandler(s => ok(JSON.parse(s))).withFailureHandler(fail).api(req));
  if (API_URL) {
    if (action === "data") return fetch(API_URL + "?format=json").then(r => r.json());
    // text/plain — иначе браузер пошлёт предзапрос, который Apps Script не пропускает
    return fetch(API_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(req) }).then(r => r.json());
  }
  return Promise.resolve(action === "data" ? DEMO : { ok: false, error: "Это прототип: сервер ещё не подключён" });
}

function notice(text, isError) {
  const n = $("notice");
  n.hidden = !text;
  n.textContent = text || "";
  n.classList.toggle("error", !!isError);
}

/** «данные на дд.мм чч:мм» в часовом поясе проекта */
function stamp(iso, tz) {
  if (!iso) return "Данные ещё не загружались";
  const d = new Date(iso);
  const f = new Intl.DateTimeFormat("ru-RU", { timeZone: tz || "Europe/Moscow", day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
  return "Данные на " + f.format(d).replace(",", "");
}

function load() {
  return call("data").then(d => {
    DATA = d;
    $("asof").textContent = stamp(d.asOf, d.tz);
    if (d.title) { $("title").textContent = d.title; document.title = d.title; }
    if (d.lastError) notice("Последнее обновление не прошло: " + d.lastError.message + ". Показаны прежние данные.", true);
    else notice(API_URL || inGas ? "" : "Прототип на демо-данных");
    render(d);
  }).catch(err => {
    notice("Не удалось загрузить данные. Обновите страницу через минуту. (" + (err && err.message || err) + ")", true);
    $("asof").textContent = "";
  });
}

/* ---------- отрисовка: ПРИМЕР, замените под ТЗ ---------- */

const S = { q: "", dept: "" };

function render(d) {
  const rows = d.rows || [];
  if (!rows.length) { $("app").innerHTML = '<p class="empty">Данных пока нет</p>'; return; }
  const cols = Object.keys(rows[0]);
  const depts = Array.from(new Set(rows.map(r => r["Отдел"]).filter(Boolean))).sort();
  const shown = rows.filter(r =>
    (!S.dept || r["Отдел"] === S.dept) &&
    (!S.q || cols.some(c => String(r[c]).toLowerCase().replace(/ё/g, "е").includes(S.q))));
  const total = shown.reduce((s, r) => s + (Number(r["Часы"]) || 0), 0);
  const num = v => typeof v === "number" || /^-?\d+([.,]\d+)?$/.test(String(v));
  $("app").innerHTML = `
    <section class="tiles">
      <div class="tile"><b>${shown.length}</b><span>строк</span></div>
      <div class="tile"><b>${total.toLocaleString("ru-RU", { maximumFractionDigits: 1 })}</b><span>часов всего</span></div>
    </section>
    <section class="filters">
      <input id="q" type="search" placeholder="Поиск" value="${esc(S.q)}" aria-label="Поиск">
      ${depts.length ? `<select id="dept" aria-label="Отдел"><option value="">Все отделы</option>${depts.map(x => `<option ${x === S.dept ? "selected" : ""}>${esc(x)}</option>`).join("")}</select>` : ""}
    </section>
    <div class="tbl">${shown.length ? `<table>
      <thead><tr>${cols.map(c => `<th>${esc(c)}</th>`).join("")}</tr></thead>
      <tbody>${shown.map(r => `<tr>${cols.map(c => `<td class="${num(r[c]) ? "num" : ""}">${esc(r[c])}</td>`).join("")}</tr>`).join("")}</tbody>
    </table>` : '<p class="empty">Ничего не нашлось — измените фильтры</p>'}</div>`;
  const q = $("q");
  q.addEventListener("input", () => { S.q = q.value.trim().toLowerCase().replace(/ё/g, "е"); render(DATA); $("q").focus(); });
  if ($("dept")) $("dept").addEventListener("change", e => { S.dept = e.target.value; render(DATA); });
}

/* ---------- кнопка «Обновить» ---------- */

$("refresh").addEventListener("click", () => {
  const b = $("refresh");
  b.disabled = true; b.textContent = "Обновляю…";
  call("sync")
    .then(r => { if (r && r.ok === false) notice("Обновить не получилось: " + r.error, true); else if (r && r.message) notice(r.message); })
    .catch(() => notice("Обновление идёт дольше обычного — данные появятся через пару минут.", false))
    .then(load)
    .then(() => { b.disabled = false; b.textContent = "Обновить"; });
});

/* ---------- запись и ИИ: ПРИМЕРЫ, используйте при необходимости ---------- */

/** Сохранить запись: save({who, text}) → {ok} */
function save(fields) { return call("save", fields); }

/** Спросить ИИ: askAi(текст) → {text}. Пока ждём — покажите «ИИ думает, до минуты».
 *  Safari обрывает запросы длиннее минуты, поэтому параллельно раз в 5 секунд
 *  спрашиваем готовый ответ по номеру запроса. */
function askAi(text) {
  const reqId = Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  return new Promise((resolve, reject) => {
    let done = false;
    const finish = r => {
      if (done) return;
      done = true;
      if (r && r.ok === false) reject(new Error(r.error)); else resolve(r);
    };
    call("ai", { text: text, reqId: reqId }).then(finish).catch(() => {});   // оборвался — дождёмся опросом
    const tick = () => {
      if (done) return;
      call("aiResult", { reqId: reqId })
        .then(r => (r.status === "done" || r.ok === false) ? finish(r) : setTimeout(tick, 5000))
        .catch(() => setTimeout(tick, 5000));
    };
    setTimeout(tick, 5000);
    setTimeout(() => finish({ ok: false, error: "ИИ не ответил за 5 минут — попробуйте ещё раз" }), 300000);
  });
}

load();
</script>
</body>
</html>
